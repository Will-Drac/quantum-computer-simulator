<body>
    <button onclick="parseQasm(document.getElementById('qasmInput').value)">Run</button>
    <br><br>
    <textarea name="qasmInput" id="qasmInput"></textarea>
    <script>
        const textArea = document.getElementById("qasmInput")
        textArea.value = localStorage.getItem("qasmInput")

        textArea.addEventListener("input", function () {
            const text = textArea.value

            localStorage.setItem("qasmInput", text)
        })
    </script>
